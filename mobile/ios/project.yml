name: Taap
options:
  bundleIdPrefix: app.taan
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: es
settings:
  base:
    SWIFT_VERSION: "5.10"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: TAAP
    INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Conecta con el orquestador TAAP en la red local."
targets:
  Taap:
    type: application
    platform: iOS
    sources: [Taap]
    info:
      path: Taap/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.taan.taap
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: "3"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  TaapUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/Unit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.taan.taap.unittests
    dependencies:
      - target: Taap
  TaapUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UI]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.taan.taap.tests
    dependencies:
      - target: Taap
schemes:
  Taap:
    build:
      targets:
        Taap:
    test:
      targets:
        TaapUnitTests:
        TaapUITests:
