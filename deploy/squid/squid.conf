# Proxy de egress por red interna.
#
# Modelo de confianza: los agentes NUNCA están en la red NAT. Su única salida
# a Internet es a través de este proxy, identificado por su IP en
# taap-internal (el orquestador asigna IP fija a cada agente). Reglas:
#   - Toda IP de agente: solo hosts de endpoints de modelo (allowlist de
#     defensa en profundidad junto al Model Proxy interno).
#   - IP de agente con Internet activado: cualquier host.
#
# El orquestador escribe el fragmento /etc/squid/taap/taap-acl.conf (ACLs
# completas) y reinicia el servicio (o `squid -k reconfigure`).

cache_effective_user squid
cache_effective_group squid

pid_filename /run/squid/squid.pid
access_log /var/log/squid/access.log
cache_log /var/log/squid/cache.log

# Fragmento gestionado por el orquestador. Contiene:
#   acl taap_agents src <IP de cada agente activo>...
#   acl taap_internet src <IP de cada agente con internet=on>...
#   acl model_hosts_url url_regex <una regex por host>  (peticiones http normales)
include /etc/squid/taap/taap-acl.conf

acl localhost src 127.0.0.0/8

cache allow all
cache deny all

acl connect_m method CONNECT

http_access allow localhost
http_access deny !taap_agents
# Taneos (CONNECT) solo a hosts de modelo; peticiones http normales igual
http_access allow taap_agents connect_m model_hosts_dns
http_access allow taap_agents model_hosts_url
# Con internet: todo (incl. taneos)
http_access allow taap_internet
http_access deny all

http_port 3128
visible_hostname taap-egress
